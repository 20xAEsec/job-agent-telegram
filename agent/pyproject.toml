[project]
name = "jobagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "qrcode>=7.4",
    "python-docx",
    "pymupdf",
    "docx2pdf>=0.1.8",
    "playwright>=1.65.2",
    "httpx>=0.28.1",
    "python-jobspy>=1.5.0",
    "keyring>=25.7.0",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
