<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobAgent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M6 20c5-9 15-9 20 0' stroke='%2335c8f0' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='13' r='2.4' fill='%239dffd6'/%3E%3C/svg%3E">
<style>
/* ===== Theme: one palette, two consumers (the scene reads these back at boot) ===== */
:root{
  --col-core:#ffffff; --col-inner:#c8f4ff; --col-mid:#35c8f0; --col-outer:#0d3f6b; --col-spark:#e6fbff; --col-accent:#9dffd6;
  --bg:#000; --ink:#eaf7ff; --ink-dim:#9fb9c9; --ink-faint:#6c8797;
  --panel:rgba(3,11,20,.76); --panel-solid:rgba(3,10,18,.95); --well:rgba(2,9,16,.55); --well-hi:rgba(200,244,255,.07);
  --hairline:rgba(200,244,255,.11); --hairline-hi:rgba(200,244,255,.26);
  --good:#9dffd6; --warn:#fcd38a; --bad:#ff8fa3;
  --step--2:.6875rem; --step--1:.8125rem; --step-0:.9375rem; --step-1:1.0625rem; --step-2:1.375rem; --step-3:1.875rem;
  --radius:18px; --radius-s:12px; --ease:cubic-bezier(.22,1,.36,1); --side:252px;
  --font:"Segoe UI Variable Text","Segoe UI",Inter,ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font:400 var(--step-0)/1.55 var(--font);color:var(--ink);background:var(--bg);overflow-x:hidden;
  background-image:radial-gradient(1100px 620px at 78% -8%,rgba(53,200,240,.13),transparent 62%),radial-gradient(900px 700px at -6% 108%,rgba(13,63,107,.42),transparent 60%)}
html[data-scene=ready] body{background-image:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--col-inner)}
::selection{background:rgba(53,200,240,.35)}

/* ===== Layer stack ===== */
#bg{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;display:block;z-index:0}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 42%,transparent 38%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 22%,transparent 70%,rgba(0,0,0,.5) 100%)}
.app{position:relative;z-index:2;display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.skip{position:fixed;left:16px;top:-60px;z-index:50;padding:10px 16px;border-radius:999px;background:var(--panel-solid);border:1px solid var(--hairline-hi);color:var(--ink);text-decoration:none;transition:top .3s var(--ease)}
.skip:focus{top:16px}

/* ===== Surfaces ===== */
.panel{background:var(--panel);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--hairline);border-radius:var(--radius);
  box-shadow:0 0 70px rgba(53,200,240,.07),inset 0 1px 0 rgba(255,255,255,.055),0 24px 60px rgba(0,0,0,.42)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel,.side,.drawer,.modal__box,.toast{background:var(--panel-solid)}}
.pad{padding:clamp(1.1rem,2vw,1.6rem)}
.well{background:var(--well);border:1px solid rgba(200,244,255,.08);border-radius:var(--radius-s)}
.kicker{font-size:var(--step--2);letter-spacing:.28em;text-transform:uppercase;color:var(--col-mid);font-weight:600}
.title{font:250 clamp(1.7rem,2.6vw,2.35rem)/1.1 var(--font-d);letter-spacing:-.02em;margin:4px 0 0;
  background:linear-gradient(180deg,#fff 0%,#e3f7ff 50%,#93b9cc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(53,200,240,.28)) drop-shadow(0 2px 10px rgba(0,0,0,.8))}
.hair{height:1px;width:112px;margin-top:12px;background:linear-gradient(90deg,rgba(53,200,240,.8),transparent)}
h2.h{font:600 var(--step--1)/1.2 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2.h .n{color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
h3.h3{font:500 var(--step-1)/1.3 var(--font);margin:0}
.muted{color:var(--ink-dim)} .faint{color:var(--ink-faint);font-size:var(--step--1)} .small{font-size:var(--step--1)}
.num{font-variant-numeric:tabular-nums}
p{margin:.4em 0}

/* ===== Controls ===== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:999px;padding:9px 18px;
  font-size:var(--step--1);font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);
  border:1px solid rgba(200,244,255,.2);background:linear-gradient(90deg,rgba(3,12,26,.6),rgba(10,30,52,.55),rgba(3,12,26,.6));
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease),opacity .2s}
.btn::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(200,244,255,.2) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s var(--ease)}
.btn:hover,.btn:focus-visible{transform:translateY(-1px);border-color:rgba(200,244,255,.38);box-shadow:0 0 28px rgba(53,200,240,.18)}
.btn:hover::after,.btn:focus-visible::after{transform:translateX(120%)}
.btn--solid{border-color:rgba(157,255,214,.55);background:linear-gradient(180deg,rgba(53,200,240,.32),rgba(13,63,107,.42));box-shadow:0 0 26px rgba(53,200,240,.22),inset 0 1px 0 rgba(255,255,255,.12)}
.btn--solid:hover{box-shadow:0 0 40px rgba(53,200,240,.36),inset 0 1px 0 rgba(255,255,255,.12)}
.btn--danger{border-color:rgba(255,143,163,.45)}
.btn--danger:hover{box-shadow:0 0 28px rgba(255,143,163,.2);border-color:rgba(255,143,163,.7)}
.btn--ghost{background:transparent;border-color:transparent;padding:7px 12px}
.btn--ghost:hover{background:rgba(200,244,255,.06);border-color:var(--hairline)}
.btn--sm{padding:6px 13px;font-size:var(--step--2)}
.btn[disabled],.btn[aria-busy=true]{opacity:.5;cursor:default;transform:none}
.btn[aria-busy=true]::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
:focus-visible{outline:2px solid rgba(53,200,240,.95);outline-offset:3px;border-radius:8px}
.input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(200,244,255,.14);background:rgba(0,6,12,.5);color:var(--ink);transition:border-color .25s,box-shadow .25s}
.input::placeholder{color:var(--ink-faint)}
.input:focus{outline:none;border-color:rgba(53,200,240,.7);box-shadow:0 0 0 3px rgba(53,200,240,.16),0 0 24px rgba(53,200,240,.12)}
textarea.input{resize:vertical;min-height:72px;line-height:1.5}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select.input option{background:#02101c}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row--end{justify-content:flex-end}
.grow{flex:1 1 auto;min-width:0}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:var(--step--2);padding:4px 11px;border-radius:999px;border:1px solid var(--hairline);color:var(--ink-dim);background:rgba(0,0,0,.25);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
.dot--on{background:var(--good);box-shadow:0 0 10px var(--good)} .dot--warn{background:var(--warn);box-shadow:0 0 10px var(--warn)} .dot--live{background:var(--col-mid);box-shadow:0 0 12px var(--col-mid);animation:pulse 1.8s ease-in-out infinite}
.score{display:inline-flex;align-items:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--step--2);padding:2px 9px;border-radius:999px}
.s-hi{color:var(--good);background:rgba(157,255,214,.1)} .s-mid{color:var(--warn);background:rgba(252,211,138,.1)} .s-lo{color:var(--bad);background:rgba(255,143,163,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-t{cursor:pointer;padding:6px 13px;border-radius:999px;border:1px solid rgba(200,244,255,.14);background:rgba(0,0,0,.22);font-size:var(--step--1);color:var(--ink-dim);transition:all .25s var(--ease)}
.chip-t:hover{border-color:rgba(200,244,255,.32);color:var(--ink)}
.chip-t[aria-pressed=true],.chip-t[aria-checked=true]{color:#fff;border-color:rgba(53,200,240,.75);background:rgba(53,200,240,.16);box-shadow:0 0 18px rgba(53,200,240,.18)}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid rgba(200,244,255,.12);background:rgba(2,9,16,.72);flex-wrap:wrap}
.seg button{cursor:pointer;border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:var(--step--1);color:var(--ink-dim);transition:all .25s var(--ease)}
.seg button[aria-checked=true]{background:rgba(53,200,240,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(53,200,240,.6)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{cursor:pointer;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid rgba(200,244,255,.1);background:rgba(0,0,0,.22);transition:all .25s var(--ease)}
.opt b{display:block;font-weight:500;font-size:var(--step--1);color:var(--ink)} .opt span{display:block;font-size:var(--step--2);color:var(--ink-faint);margin-top:2px;line-height:1.45}
.opt:hover{border-color:rgba(200,244,255,.26)}
.opt[aria-checked=true]{border-color:rgba(53,200,240,.7);background:rgba(53,200,240,.1);box-shadow:0 0 22px rgba(53,200,240,.14)}
.switch{cursor:pointer;position:relative;width:46px;height:26px;border-radius:999px;border:1px solid rgba(200,244,255,.2);background:rgba(0,0,0,.4);flex:none;transition:all .3s var(--ease)}
.switch span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-faint);transition:all .3s var(--ease)}
.switch[aria-checked=true]{background:rgba(53,200,240,.3);border-color:rgba(53,200,240,.8);box-shadow:0 0 18px rgba(53,200,240,.25)}
.switch[aria-checked=true] span{left:23px;background:#fff;box-shadow:0 0 10px rgba(200,244,255,.8)}
.tags{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:7px;border-radius:12px;border:1px solid rgba(200,244,255,.12);background:rgba(0,6,12,.45)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 11px;border-radius:999px;background:rgba(53,200,240,.12);border:1px solid rgba(53,200,240,.3);font-size:var(--step--1)}
.tag button{cursor:pointer;border:0;background:transparent;color:var(--ink-dim);width:20px;height:20px;border-radius:50%;line-height:1}
.tag button:hover{background:rgba(255,255,255,.1);color:#fff}
.input--tag{flex:1 1 160px;width:auto;border:0;background:transparent;padding:5px 6px;box-shadow:none!important}
.track{height:7px;border-radius:99px;background:rgba(200,244,255,.08);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(13,63,107,.9),var(--col-mid) 70%,var(--col-inner));box-shadow:0 0 12px rgba(53,200,240,.45);transform-origin:left}
.fresh .fill{animation:grow 1.1s var(--ease) both}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center;margin:9px 0}
.bar .num{text-align:right}

/* ===== Sidebar ===== */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:26px 16px 18px;border-right:1px solid var(--hairline);
  background:linear-gradient(180deg,rgba(2,10,20,.72),rgba(1,6,12,.62));backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand__mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle at 50% 70%,rgba(53,200,240,.45),rgba(13,63,107,.35) 60%,transparent 70%),#020a12;border:1px solid rgba(53,200,240,.35);box-shadow:0 0 24px rgba(53,200,240,.25)}
.brand__name{font:300 1.15rem/1 var(--font-d);letter-spacing:.06em}
.brand__sub{font-size:var(--step--2);color:var(--ink-faint);letter-spacing:.08em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-dim);text-decoration:none;font-size:var(--step-0);transition:all .3s var(--ease)}
.nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a:hover{color:var(--ink);background:rgba(200,244,255,.045)}
.nav a[aria-current=page]{color:#fff;background:linear-gradient(90deg,rgba(53,200,240,.16),rgba(53,200,240,.02));box-shadow:inset 0 0 0 1px rgba(53,200,240,.2)}
.nav a[aria-current=page]::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--col-mid);box-shadow:0 0 14px var(--col-mid)}
.nav .badge{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-size:.7rem;font-weight:600;color:#00131f;background:var(--col-accent);box-shadow:0 0 14px rgba(157,255,214,.45)}
.nav .badge--warn{background:var(--warn);box-shadow:0 0 14px rgba(252,211,138,.4)}
.side__foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.status-card{padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--hairline)}
.status-card .row{gap:8px}

/* ===== Main column ===== */
.main-col{min-width:0;padding:30px clamp(16px,3vw,44px) 80px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.linkbox{display:flex;gap:8px;align-items:center;width:min(520px,100%);padding:6px 6px 6px 16px;border-radius:999px}
.linkbox .input{border:0;background:transparent;padding:8px 4px;box-shadow:none!important}
.linkbox svg{width:17px;height:17px;stroke:var(--col-mid);fill:none;stroke-width:1.7;flex:none}
main:focus{outline:none}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);align-items:start}
.empty{padding:28px 10px;text-align:center;color:var(--ink-faint)}
.empty b{display:block;font:300 var(--step-2) var(--font-d);color:var(--ink-dim);margin-bottom:6px}

/* Overview */
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:clamp(1.3rem,2.4vw,2rem)}
.hero__now{font:250 clamp(1.35rem,2.2vw,1.9rem)/1.2 var(--font-d);letter-spacing:-.015em;margin:6px 0}
.hero__meta{color:var(--ink-dim);font-size:var(--step--1)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{display:block;text-align:left;padding:18px;border-radius:16px;text-decoration:none;color:var(--ink);cursor:pointer;transition:transform .35s var(--ease),border-color .35s,box-shadow .35s}
.tile:hover{transform:translateY(-2px);border-color:rgba(53,200,240,.3);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 26px rgba(53,200,240,.13)}
.tile__n{font:200 2.5rem/1 var(--font-d);font-variant-numeric:tabular-nums}
.tile--hot .tile__n{color:#fff;text-shadow:0 0 24px rgba(53,200,240,.7)}
.tile__l{color:var(--ink-dim);font-size:var(--step--1);margin-top:8px}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:16px;border:1px solid rgba(53,200,240,.3);background:linear-gradient(90deg,rgba(9,44,66,.86),rgba(3,11,20,.82))}
.banner--warn{border-color:rgba(252,211,138,.35);background:linear-gradient(90deg,rgba(54,40,14,.86),rgba(3,11,20,.82))}
.banner__body{flex:1 1 280px;min-width:0}
.banner__t{font-weight:600}
.feed{display:flex;flex-direction:column;gap:10px}
.card{padding:14px 16px}
.card__top{display:flex;gap:10px;align-items:center}
.card__t{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card__t button,.linkbtn{all:unset;cursor:pointer} .card__t button:hover,.linkbtn:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--hairline-hi)}
.card__t button:focus-visible,.linkbtn:focus-visible{outline:2px solid rgba(53,200,240,.95);outline-offset:3px;border-radius:4px}
.card__doing{color:var(--ink-dim);font-size:var(--step--1);margin-top:6px}
.card__final{margin-top:8px;font-size:var(--step--1)}
.card .row{margin-top:10px}
.lines{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:10px;font-size:var(--step--1);align-items:baseline}
.line span:first-child{flex:none;width:20px;text-align:center}
.steps{display:flex;align-items:center;margin-top:12px;gap:0}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;font-size:.68rem;color:var(--ink-faint);letter-spacing:.04em}
.step::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:1px;background:rgba(200,244,255,.14)}
.step:first-child::before{display:none}
.step i{position:relative;z-index:1;width:13px;height:13px;border-radius:50%;border:1px solid rgba(200,244,255,.25);background:#000}
.step--done{color:var(--ink-dim)} .step--done i{background:var(--col-mid);border-color:var(--col-mid);box-shadow:0 0 10px rgba(53,200,240,.6)}
.step--done::before,.step--now::before{background:rgba(53,200,240,.6)}
.step--now{color:#fff} .step--now i{border-color:var(--col-accent);box-shadow:0 0 0 4px rgba(157,255,214,.12),0 0 14px rgba(157,255,214,.6);animation:pulse 1.8s ease-in-out infinite}
.step em{font-style:normal;color:var(--col-accent);font-size:.66rem}
.meter{display:flex;flex-direction:column;gap:7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline}
.kv dt{color:var(--ink-faint);font-size:var(--step--1)} .kv dd{margin:0}

/* Review */
.rv{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.rv-list{display:flex;flex-direction:column;gap:8px;position:sticky;top:20px}
.rv-item{display:block;width:100%;text-align:left;cursor:pointer;padding:13px 14px;color:var(--ink);background:var(--panel-solid);transition:all .3s var(--ease)}
.rv-item:hover{border-color:rgba(200,244,255,.24)}
.rv-item[aria-current=true]{border-color:rgba(53,200,240,.65);background:linear-gradient(rgba(53,200,240,.1),rgba(53,200,240,.1)),var(--panel-solid);box-shadow:0 0 26px rgba(53,200,240,.14)}
.rv-head{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ring{--v:0;--c:var(--col-mid);width:86px;height:86px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(closest-side,#020b14 79%,transparent 80% 100%),conic-gradient(var(--c) calc(var(--v)*1%),rgba(200,244,255,.08) 0);box-shadow:0 0 30px rgba(53,200,240,.15)}
.ring b{font:250 1.7rem/1 var(--font-d);font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:.62rem;color:var(--ink-faint);text-align:center;letter-spacing:.1em}
.sec{padding-top:18px;margin-top:18px;border-top:1px solid var(--hairline)}
.sec:first-child{padding-top:0;margin-top:0;border-top:0}
.sec h4{margin:0 0 10px;font-size:var(--step--2);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.ans{display:grid;grid-template-columns:22px minmax(0,38%) 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid rgba(200,244,255,.06)}
.ans:last-child{border-bottom:0}
.ans__v{word-break:break-word}
.ans form{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.chg{padding:11px 13px;margin:8px 0;border-radius:12px;background:var(--well)}
.chg del{color:var(--ink-faint);text-decoration-color:rgba(255,143,163,.6)} .chg ins{text-decoration:none;color:var(--ink);display:block;margin-top:5px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.shots img{width:100%;border-radius:12px;border:1px solid var(--hairline);display:block;cursor:zoom-in;background:#04101a;min-height:120px}
.acts{position:sticky;bottom:14px;z-index:3;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;margin-top:18px;border-radius:999px}
.acts.panel{background:var(--panel-solid)}
.file{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--well);border:1px solid rgba(200,244,255,.08);cursor:pointer;color:var(--ink);font-size:var(--step--1)}
.file:hover{border-color:rgba(53,200,240,.4)}
.warnbox{padding:11px 14px;border-radius:12px;border:1px solid rgba(252,211,138,.3);background:rgba(252,211,138,.06);color:#ffe6bd;font-size:var(--step--1);margin:8px 0}

/* Jobs */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.col{padding:14px;min-height:200px}
.col h2{font-size:var(--step--2);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink-dim);margin:0 0 12px;display:flex;justify-content:space-between}
.col h2 b{color:var(--ink)}
.job{display:block;width:100%;text-align:left;padding:12px;margin:0 0 9px;color:var(--ink);cursor:pointer;transition:all .3s var(--ease)}
.job:hover{transform:translateY(-1px);border-color:rgba(53,200,240,.3)}
.job .co{font-weight:500} .job .ro{color:var(--ink-dim);font-size:var(--step--1);margin:2px 0 8px}
.job .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--step--2);color:var(--ink-faint)}
.table{width:100%;border-collapse:collapse}
.table th{font-size:var(--step--2);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--hairline)}
.table td{padding:12px;border-bottom:1px solid rgba(200,244,255,.05);vertical-align:middle}
.table tbody tr{cursor:pointer;transition:background .2s}
.table tbody tr:hover{background:rgba(53,200,240,.05)}
.table .co{font-weight:500}

/* Questions & forms */
.q{padding:16px 0;border-top:1px solid var(--hairline)}
.q:first-of-type{border-top:0}
.q__t{font-weight:500;margin-bottom:4px}
.q__why{color:var(--ink-faint);font-size:var(--step--1);margin-bottom:10px}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:var(--step--2);color:var(--col-accent);border:1px solid rgba(157,255,214,.3);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:var(--step--1);color:var(--ink-dim);margin-top:10px}
.check input{accent-color:var(--col-mid);width:16px;height:16px}

/* Settings */
.set-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.subnav{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:10px}
.subnav a{padding:8px 12px;border-radius:10px;color:var(--ink-dim);text-decoration:none;font-size:var(--step--1)}
.subnav a:hover{color:#fff;background:rgba(200,244,255,.05)}
.set{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:18px 0;border-top:1px solid rgba(200,244,255,.07)}
.set:first-of-type{border-top:0;padding-top:4px}
.set__head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.set__label{font-weight:500}
.set__what{color:var(--ink-faint);font-size:var(--step--1);max-width:70ch;margin-top:2px}
.set__now{font-size:var(--step--1);color:var(--col-inner);text-align:right;max-width:40%;flex:none}
.int{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.int .input{width:180px}
.anchor{scroll-margin-top:20px}

/* Drawer, modal, toast */
.dscrim{position:fixed;inset:0;z-index:20;background:rgba(0,4,8,.55);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.dscrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:21;top:0;right:0;height:100%;width:min(660px,100%);overflow-y:auto;padding:30px 30px 0;border-radius:0;border-width:0 0 0 1px;transform:translateX(104%);transition:transform .6s var(--ease)}
.drawer.on{transform:none}
.drawer .acts{bottom:16px;margin-bottom:20px}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(0,4,8,.6);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.modal.on{opacity:1;pointer-events:auto}
.modal__box{width:min(520px,100%);padding:26px;transform:translateY(12px) scale(.98);transition:transform .45s var(--ease)}
.modal.on .modal__box{transform:none}
.modal__box h3{font:300 var(--step-2)/1.25 var(--font-d);margin:0 0 10px}
.toast{position:fixed;z-index:60;left:50%;bottom:26px;max-width:min(560px,calc(100% - 32px));transform:translate(-50%,24px);opacity:0;padding:12px 20px;border-radius:999px;transition:all .45s var(--ease);pointer-events:none;font-size:var(--step--1);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast--bad{border-color:rgba(255,143,163,.5)}
.lightbox{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

/* Entrances: only on a fresh view, never on the live refresh */
.fresh .rise{animation:rise .85s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===== Narrow screens: the sidebar becomes a top bar ===== */
@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side{grid-template-columns:minmax(0,1fr)}
  .rv{grid-template-columns:minmax(0,1fr)}
  .rv-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .rv-item{min-width:230px}
  .set-layout{grid-template-columns:minmax(0,1fr)}
  .subnav{position:static;flex-direction:row;overflow-x:auto}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;z-index:5;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--hairline)}
  .brand__sub,.side__foot{display:none}
  .brand{padding:0}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 11px;flex:none}
  .nav a span.lbl{display:none}
  .nav a[aria-current=page] span.lbl{display:inline}
  .nav a[aria-current=page]::before{display:none}
  .nav a:not([aria-current=page]) .badge{position:absolute;top:1px;right:0;min-width:17px;height:17px;padding:0 4px;font-size:.62rem}
  .main-col{padding:20px 16px 90px}
  .drawer{padding:20px 16px 0}
}
@media (max-width:560px){
  .tiles{gap:10px} .tile{padding:14px} .tile__n{font-size:2rem}
  .ans{grid-template-columns:22px minmax(0,1fr) auto}
  .ans .ans__l{grid-column:2/4} .ans .ans__v{grid-column:2/3}
  .bar{grid-template-columns:90px 1fr 52px}
  .acts{border-radius:20px;position:static}
  .set__head{flex-direction:column;gap:6px} .set__now{text-align:left;max-width:none}
  .table .hide-s{display:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="scrim"></div>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side" aria-label="JobAgent">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M6 20c5-9 15-9 20 0" stroke="#35c8f0" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="16" cy="13" r="2.4" fill="#9dffd6"/></svg></div>
      <div><div class="brand__name">JobAgent</div><div class="brand__sub">Your job search, on autopilot</div></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side__foot" id="sideFoot"></div>
  </aside>
  <div class="main-col">
    <header class="top">
      <div><div class="kicker" id="kicker">JobAgent</div><h1 class="title" id="pageTitle">Overview</h1><div class="hair"></div></div>
      <form class="linkbox panel" id="linkForm" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" stroke-linecap="round"/></svg>
        <label for="linkIn" class="skip" style="position:absolute;left:-9999px">Job link</label>
        <input class="input" id="linkIn" name="url" placeholder="Paste a job link to apply…" inputmode="url">
        <button class="btn btn--solid btn--sm" type="submit">Start</button>
      </form>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="dscrim" id="dscrim"></div>
<aside class="drawer panel" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal__box panel" id="modalBox"></div></div>
<div class="toast panel" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".pdf,.docx" hidden>

<script>
'use strict'
// ===================================================================================================================
// JobAgent desktop front end. Everything the Telegram screens do, laid out for a big screen. The page holds no data:
// it signs in, then asks the API. Buttons that mirror a Telegram button send its code ("tap"); typed input has its own
// call. Private answers never reach the page: they show as 🔒 and can be replaced, never read.
// ===================================================================================================================
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)]
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const scoreCls = n => n == null ? '' : n >= 80 ? 's-hi' : n >= 60 ? 's-mid' : 's-lo'
const scoreTag = n => n == null ? '' : `<span class="score ${scoreCls(n)}">${n}</span>`
const ms = t => typeof t === 'number' ? t : Date.parse(t)
const ago = t => { const m = Math.round((Date.now() - ms(t)) / 60000); return !isFinite(m) ? '' : m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago` }
const until = t => { const m = Math.round((ms(t) - Date.now()) / 60000); return !isFinite(m) ? '' : m <= 0 ? 'any moment' : m < 60 ? `in ${m} min` : m < 1440 ? `in ${Math.round(m / 60)} h` : `in ${Math.round(m / 1440)} d` }
const dur = d => { const s = Math.max(0, Math.round(d / 1000)); return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min` }
const clock = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`
const ICON = {
  overview: '<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  review: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="m8.5 12.2 2.4 2.4 4.6-5.2"/>',
  jobs: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.6c0-.9.7-1.6 1.6-1.6h3.8c.9 0 1.6.7 1.6 1.6V7M3 12.5h18"/>',
  questions: '<circle cx="12" cy="12" r="8.6"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5M12 16.9v.1"/>',
  profile: '<circle cx="12" cy="8.2" r="3.8"/><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5"/>',
  settings: '<path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/>',
  insights: '<path d="M5.5 19v-7M11.5 19V5M17.5 19v-9.5M3.5 19h17"/>',
  health: '<path d="M3 12.5h4l2.2-5 4 10.5 2.2-5.5H21"/>',
}
const VIEWS = {
  overview: { title: 'Overview', kicker: 'What is happening' },
  review: { title: 'Review', kicker: 'Waiting for your OK' },
  jobs: { title: 'Jobs', kicker: 'Every job and application' },
  questions: { title: 'Questions', kicker: 'Only you can answer these' },
  profile: { title: 'Profile', kicker: 'What I apply with' },
  settings: { title: 'Settings', kicker: 'What I look for and how I apply' },
  insights: { title: 'Insights', kicker: 'Where applications go' },
  health: { title: 'Health', kicker: 'This computer' },
}
let S = null, L = null, view = 'overview', param = '', openId = null, SET = {}, FORMS = [], PROFILE = null, LOGINS = null, REVIEW = null

// ---- Sign-in (phone: Telegram Mini App data in the URL fragment, traded for a session token) and the API ----
let session = ''
try { session = sessionStorage.getItem('jd-session') || '' } catch {}
async function signIn() {
  const data = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData')
  if (!data) return
  history.replaceState(null, '', location.pathname)
  const r = await fetch('/api/tg-auth', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ init_data: data }) })
  const x = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(x.error || 'Could not sign in.')
  session = x.token
  try { sessionStorage.setItem('jd-session', session) } catch {}
}
const authHeaders = () => (session ? { 'x-session': session } : {})
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) } : { headers: authHeaders() })
  const x = await r.json().catch(() => ({ error: 'JobAgent did not answer. Is it still running?' }))
  if (!r.ok) throw new Error(x.error || 'Something went wrong.')
  return x
}
const call = (op, body = {}) => api('/api/do', { op, ...body })
async function blobOf(url) { const r = await fetch(url, { headers: authHeaders() }); if (!r.ok) throw new Error('Could not open that file.'); return r.blob() }
async function loadImages(root) {
  for (const img of $$('img[data-src]', root)) { try { img.src = URL.createObjectURL(await blobOf(img.dataset.src)) } catch {} }
}
async function openFile(url, name) {
  try {
    const b = await blobOf(url), u = URL.createObjectURL(b)
    if (/\.pdf$/i.test(name) && window.open(u, '_blank', 'noopener')) return
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove()
  } catch (e) { toast(e.message, true) }
}

// ---- Feedback: toast, confirm/ask modal ----
function toast(t, bad = false) { const el = $('#toast'); el.textContent = t; el.classList.toggle('toast--bad', bad); el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), bad ? 5200 : 3400) }
function ask({ title, body = '', ok = 'OK', danger = false, input = null }) {
  return new Promise(done => {
    const m = $('#modal'), box = $('#modalBox'), back = document.activeElement
    box.innerHTML = `<h3 id="mTitle">${esc(title)}</h3>${body ? `<div class="muted small">${body}</div>` : ''}
      ${input ? `<textarea class="input" id="mIn" rows="${input.rows || 3}" placeholder="${esc(input.placeholder || '')}" style="margin-top:14px">${esc(input.value || '')}</textarea>` : ''}
      <div class="row row--end" style="margin-top:20px"><button class="btn btn--ghost" data-m="no">Cancel</button><button class="btn ${danger ? 'btn--danger' : 'btn--solid'}" data-m="ok">${esc(ok)}</button></div>`
    m.classList.add('on')
    const close = v => { m.classList.remove('on'); m.onclick = null; document.removeEventListener('keydown', key, true); back?.focus?.(); done(v) }
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null) } }
    document.addEventListener('keydown', key, true)
    m.onclick = e => { const b = e.target.closest('[data-m]'); if (e.target === m) close(null); else if (b) close(b.dataset.m === 'ok' ? (input ? $('#mIn').value.trim() : true) : null) }
    setTimeout(() => (input ? $('#mIn') : box.querySelector('[data-m=ok]')).focus(), 60)
  })
}
async function busy(btn, f) {
  if (btn) { if (btn.getAttribute('aria-busy') === 'true') return; btn.setAttribute('aria-busy', 'true') }
  try { return await f() } catch (e) { toast(e.message, true) } finally { btn?.removeAttribute('aria-busy') }
}
async function tap(data, btn, say) {
  return busy(btn, async () => { const r = await call('tap', { data }); toast(say || r.text || 'Done'); await refresh(true) })
}

// ---- Shell: nav, side footer, header ----
function needs() { return L?.needs ?? { reviews: S.jobs.filter(j => j.status_code === 'AWAITING_APPROVAL').length, kits: 0, forms: 0, other: 0, total: 0 } }
function shell() {
  const n = needs(), hp = S.health ? S.health.checks.filter(c => !c.ok && c.required).length : 0
  const badge = { review: n.reviews, questions: n.forms, jobs: n.kits + n.other, health: hp }
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<a href="#/${k}" ${k === view ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span class="lbl">${v.title}</span>${badge[k] ? `<span class="badge ${k === 'health' ? 'badge--warn' : ''}" aria-label="${badge[k]} waiting">${badge[k]}</span>` : ''}</a>`).join('')
  const on = L ? L.agent_on : true
  $('#sideFoot').innerHTML = `
    <div class="status-card">
      <div class="row"><span class="dot ${!on ? 'dot--warn' : L?.work ? 'dot--live' : 'dot--on'}"></span><span class="small">${!on ? 'Paused' : L?.work ? 'Working' : 'Running · idle'}</span></div>
      <div class="row" style="margin-top:6px"><span class="dot ${S.practice ? 'dot--warn' : 'dot--on'}"></span><span class="small">${S.practice ? 'Practice mode: nothing is sent' : 'Live: approvals are sent'}</span></div>
    </div>
    ${L ? `<div class="row"><button class="btn btn--sm grow" data-tap="${on ? 'H:pause' : 'H:resume'}">${on ? 'Pause' : 'Resume'}</button><button class="btn btn--sm grow" data-tap="d:run" ${L.searching || !L.discovery ? 'disabled' : ''}>${L.searching ? 'Searching…' : 'Search now'}</button></div>` : ''}`
  $('#pageTitle').textContent = VIEWS[view].title
  $('#kicker').textContent = VIEWS[view].kicker
  document.title = `${n.total ? `(${n.total}) ` : ''}${VIEWS[view].title} · JobAgent`
}

// ---- Overview ----
const STAGES = [['read', 'Read'], ['score', 'Score'], ['tailor', 'Tailor'], ['fill', 'Fill'], ['review', 'Review']]
function stepper(line, running) {
  const at = line.stage ? STAGES.findIndex(s => s[0] === line.stage) : -1
  return `<div class="steps" aria-label="Progress">${STAGES.map(([k, l], i) => {
    const st = i < at || (i === at && (!running || k === 'review')) || (i === at && line.final) ? 'done' : i === at ? 'now' : ''
    return `<div class="step ${st ? 'step--' + st : ''}"><i></i>${l}${line.details?.[k] ? `<em>${esc(line.details[k])}</em>` : ''}</div>`
  }).join('')}</div>`
}
const btns = (list = [], ctx = '') => list.map(b => `<button class="btn btn--sm ${b.style === 'success' ? 'btn--solid' : b.style === 'danger' ? 'btn--danger' : ''}" data-${/^(r:rv|j:kit|j:rc|F:list)/.test(b.data) ? 'nav' : 'tap'}="${esc(b.data)}" ${ctx}${b.confirm ? ` data-confirm="${esc(b.confirm)}" data-ok="Delete"` : ''}>${esc(b.text)}</button>`).join('')
function cardHtml(c, i) {
  const live = c.state === 'running', now = Date.now(), job = c.jobs[0]
  const chip = live ? `<span class="pill"><span class="dot dot--live"></span>${c.started ? dur(now - c.started) : 'Working'}</span>`
    : c.state === 'queued' ? `<span class="pill">In line${c.position ? ` · #${c.position}` : ''}</span>`
    : c.state === 'paused' ? '<span class="pill"><span class="dot dot--warn"></span>Paused</span>'
    : c.state === 'waiting' ? `<span class="pill"><span class="dot dot--warn"></span>Waiting${c.wait_until ? ` until ${clock(c.wait_until)}` : ''}</span>`
    : c.ended ? `<span class="faint">${ago(c.ended)}</span>` : ''
  const title = c.mode === 'job' && job?.job_id ? `<button data-job="${esc(job.job_id)}">${esc(job.title || c.title)}</button>` : esc(c.mode === 'job' && job?.title ? job.title : c.title)

}

// ---- Review ----
const queue = () => S.jobs.filter(j => j.status_code === 'AWAITING_APPROVAL').sort((a, b) => (b.score ?? -1) - (a.score ?? -1))
const PARTS = { title: 'Title', seniority: 'Level', skills: 'Skills', location: 'Place', pay: 'Pay' }

}
async function reviewView(fresh) {

}

// ---- Jobs ----

let jobsMode = 'list', jobsQuery = ''
try { jobsMode = localStorage.getItem('jd-jobs-mode') || 'list' } catch {}

  }

    ${list.slice(0, 400).map(j => `<tr data-job="${esc(j.id)}" tabindex="0"><td><div class="co">${esc(j.company || 'Unknown company')}</div><div class="faint">${esc(j.role || j.id)}</div></td><td class="small">${esc(j.status)}</td><td>${scoreTag(j.score)}</td><td class="small muted hide-s">${esc(j.location || '')}</td><td class="faint hide-s">${esc(ago(j.updated_at))}</td></tr>`).join('')}

async function questionsView() {
  try { FORMS = await api('/api/view/forms') } catch (e) { return `<section class="panel pad">${esc(e.message)}</section>` }
  if (!FORMS.length) return `<section class="panel pad rise"><div class="empty"><b>No questions waiting</b>When an application asks something only you can answer, it appears here.</div></section>`
  return `<div class="stack">${FORMS.map((f, fi) => `<form class="panel pad rise" style="--i:${fi}" data-form="${fi}">
    <div class="row"><div class="grow"><div class="kicker">${plural(f.questions.length, 'question')}</div><h3 class="h3" style="margin-top:4px;font-weight:400">${esc(f.title)}</h3></div>${f.job_id ? `<button type="button" class="btn btn--sm" data-job="${esc(f.job_id)}">View job</button>` : ''}</div>
    <div style="margin-top:8px">${f.questions.map((q, qi) => qHtml(q, fi, qi)).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn btn--solid">Send answers</button>${f.job_id ? `<button type="button" class="btn btn--ghost" data-skipform="${fi}">⏭ Skip this job</button>` : ''}<span class="faint grow" style="text-align:right">🔒 Private answers are saved on this computer only, never guessed.</span></div>
  </form>`).join('')}</div>`
}
function qHtml(q, fi, qi) {
  const n = `q-${fi}-${qi}`, opts = q.options || [], a = q.answer
  let ctl
  if ((q.kind === 'choice' || q.kind === 'yesno') && opts.length <= 8) ctl = `<div class="chips" role="radiogroup" aria-labelledby="${n}">${opts.map((o, i) => `<button type="button" class="chip-t" role="radio" aria-checked="${a === o}" data-pick="${qi}" data-o="${i}">${esc(o)}</button>`).join('')}</div>`
  else if (q.kind === 'choice' || q.kind === 'yesno') ctl = `<select class="input" data-q="${qi}" aria-labelledby="${n}"><option value="">Choose…</option>${opts.map((o, i) => `<option value="${i}" ${a === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
  else if (q.kind === 'multi') ctl = `<div class="chips" aria-labelledby="${n}">${opts.map((o, i) => `<button type="button" class="chip-t" aria-pressed="${Array.isArray(a) && a.includes(o)}" data-multi-q="${qi}" data-o="${i}">${esc(o)}</button>`).join('')}</div>`
  else if (q.kind === 'text') ctl = `<textarea class="input" data-q="${qi}" rows="2" aria-labelledby="${n}" placeholder="${q.sensitive && q.answered ? 'Already answered (private). Leave empty to keep it.' : 'Your answer'}">${esc(a ?? '')}</textarea>`
  else ctl = `<input class="input" data-q="${qi}" aria-labelledby="${n}" value="${esc(a ?? '')}" ${q.kind === 'number' ? 'inputmode="numeric"' : ''} placeholder="${q.sensitive && q.answered ? 'Already answered (private). Leave empty to keep it.' : q.kind === 'number' ? 'A number, like 95000 or 95k' : 'A date like 2026-12-01, “2 weeks” or “immediately”'}" style="max-width:420px">`
  return `<div class="q"><div class="q__t" id="${n}">${qi + 1}. ${esc(q.text)}${q.sensitive ? '<span class="lock">🔒 private</span>' : ''}${q.answered ? ' <span class="faint">· answered</span>' : ''}</div>${q.why ? `<div class="q__why">${esc(q.why)}</div>` : ''}${ctl}
    ${q.can_save ? `<label class="check"><input type="checkbox" data-remember="${qi}" ${q.remember ? 'checked' : ''}> Remember it for next time</label>` : ''}</div>`
}
function collectForm(form) {
  const f = FORMS[+form.dataset.form], answers = {}, remember = {}
  f.questions.forEach((q, qi) => {
    const opts = q.options || []
    if (q.kind === 'multi') { const v = $$(`[data-multi-q="${qi}"][aria-pressed=true]`, form).map(b => opts[+b.dataset.o]); if (v.length) answers[q.qid] = v }
    else if ((q.kind === 'choice' || q.kind === 'yesno') && opts.length <= 8) { const b = $(`[data-pick="${qi}"][aria-checked=true]`, form); if (b) answers[q.qid] = opts[+b.dataset.o] }
    else { const el = $(`[data-q="${qi}"]`, form), v = el?.value.trim() ?? ''; if (v) answers[q.qid] = el.tagName === 'SELECT' ? opts[+v] : v }
    const r = $(`[data-remember="${qi}"]`, form); if (r) remember[q.qid] = r.checked
  })
  return { batch: f.batch, answers, remember }
}

function setRow(it) {
  const head = it.t === 'bool'
    ? `<button class="switch" role="switch" aria-checked="${!!it.value}" data-set="${it.id}" data-bool aria-label="${esc(it.label)}"><span></span></button>`
    : `<div class="set__now">${esc(it.text)}</div>`

function ctl(it) {
  const id = it.id, v = it.value
  if (it.t === 'enum') {
    if (it.opts.some(o => o[2])) return `<div class="opts" role="radiogroup" aria-label="${esc(it.label)}">${it.opts.map((o, i) => `<button class="opt" role="radio" aria-checked="${o[0] === v}" data-set="${id}" data-opt="${i}"><b>${esc(o[1])}</b>${o[2] ? `<span>${esc(o[2])}</span>` : ''}</button>`).join('')}</div>`
    if (it.opts.length <= 4) return `<div class="seg" role="radiogroup" aria-label="${esc(it.label)}">${it.opts.map((o, i) => `<button role="radio" aria-checked="${o[0] === v}" data-set="${id}" data-opt="${i}">${esc(o[1])}</button>`).join('')}</div>`
    return `<select class="input" style="max-width:320px" data-set="${id}" data-sel aria-label="${esc(it.label)}">${it.opts.map((o, i) => `<option value="${i}" ${o[0] === v ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
  }
  if (it.t === 'multi') return `<div class="chips" aria-label="${esc(it.label)}">${it.opts.map((o, i) => `<button class="chip-t" aria-pressed="${(v || []).includes(o[0])}" data-set="${id}" data-multi="${i}">${esc(o[1])}</button>`).join('')}</div>`
  if (it.t === 'int') return `<div class="int"><input class="input" data-set="${id}" data-int value="${v ?? ''}" inputmode="numeric" placeholder="${esc(it.nullable || 'Type a number')}" aria-label="${esc(it.label)}">${it.unit ? `<span class="faint">${esc(it.unit)}</span>` : ''}</div>

  if (it.t === 'time') return `<input type="time" class="input" style="width:160px" data-set="${id}" data-time value="${esc(v || '')}" aria-label="${esc(it.label)}">`
  const ideas = id === 'rt' ? SET._x.ideas : []
  return `<div class="tags">${(v || []).map((x, i) => `<span class="tag">${esc(x)}<button aria-label="Remove ${esc(x)}" data-set="${id}" data-rm="${i}">×</button></span>`).join('')}<input class="input input--tag" data-set="${id}" data-add placeholder="${v?.length ? 'Add more…' : `Add… ${it.example ? `like ${esc(it.example)}` : ''}`}" aria-label="Add to ${esc(it.label)}"></div>

}

  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000)
  let W = canvas.clientWidth || innerWidth, H = canvas.clientHeight || innerHeight
  const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 80); camera.position.set(0, 0, 6.2); scene.add(camera)
  const rig = new THREE.Group(); scene.add(rig)    // TRANSLATE only, never rotated
  const group = new THREE.Group(); rig.add(group)  // the subject; this one animates

  const COL = { core: hexToVec3(token('--col-core')), inner: hexToVec3(token('--col-inner')), mid: hexToVec3(token('--col-mid')), outer: hexToVec3(token('--col-outer')), spark: hexToVec3(token('--col-spark')) }
  const add = { blending: THREE.AdditiveBlending, transparent: true, depthTest: false, depthWrite: false }

  // ---- Sheets: the vertex shader does all the work ----
  const sheetVert = `
    uniform float uTime, uAmp, uEnergy, uPhase;
    varying float vHeight, vEdge; varying vec2 vUv;
    void main(){
      vUv = uv;
      float t = uTime * 0.11 + uPhase;
      vec2  q = position.xy * 0.22;
      float w1 = sin(q.x * 1.7 + t * 1.3) * cos(q.y * 1.1 - t);
      float w2 = sin(q.x * 3.1 - t * 0.7 + w1 * 1.4);
      float h  = w1 * 0.8 + w2 * 0.35;
      vec3 p = position;
      p.z += h * uAmp * (1.0 + uEnergy * 0.8);
      vHeight = h;
      vEdge   = abs(w2);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`
  const sheetFrag = `
    uniform vec3 uColCore, uColMid, uColOuter; uniform float uBrightness, uAlpha;
    varying float vHeight, vEdge; varying vec2 vUv;
    void main(){
      float crease = pow(1.0 - clamp(vEdge, 0.0, 1.0), 3.0);
      vec3  c = mix(uColOuter, uColMid, clamp(vHeight * 0.5 + 0.5, 0.0, 1.0));
      c = mix(c, uColCore, crease * 0.65);
      float fade = smoothstep(0.5, 0.15, abs(vUv.y - 0.5)) * smoothstep(0.5, 0.2, abs(vUv.x - 0.5));
      gl_FragColor = vec4(c * uBrightness * (0.1 + crease * 0.95), fade * uAlpha * 0.5);
    }`
  const mats = []
  const segX = lowPower ? 100 : 160, segY = lowPower ? 44 : 72
  for (const [amp, z, y, ry, rx, phase, alpha] of SHEETS) {
    const m = new THREE.ShaderMaterial({ ...add, side: THREE.DoubleSide, vertexShader: sheetVert, fragmentShader: sheetFrag, uniforms: {
      uTime: { value: 0 }, uAmp: { value: amp }, uEnergy: { value: 0 }, uPhase: { value: phase + rng() * 0.4 },
      uColCore: { value: COL.core }, uColMid: { value: COL.mid }, uColOuter: { value: COL.outer }, uBrightness: { value: BASE }, uAlpha: { value: alpha } } })
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(18, 8, segX, segY), m)
    mesh.position.set((rng() - 0.5) * 0.8, y, z); mesh.rotation.set(rx, ry, (rng() - 0.5) * 0.12)
    mesh.frustumCulled = false // displaced in the vertex shader: its bounding box is wrong
    group.add(mesh); mats.push(m)
  }

  // ---- Motes: a sparse dust for scale, heavy-tailed brightness ----
  const N = lowPower ? 120 : 220, pos = new Float32Array(N * 3), seed = new Float32Array(N), size = new Float32Array(N)
  for (let i = 0; i < N; i++) {
    pos[i * 3] = (rng() - 0.5) * 16; pos[i * 3 + 1] = -3.5 + rng() * 7.5; pos[i * 3 + 2] = -5 + rng() * 6.5
    seed[i] = rng(); size[i] = 0.35 + Math.pow(rng(), 3) * 2.2
  }
  const mg = new THREE.BufferGeometry()
  mg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); mg.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1)); mg.setAttribute('aSize', new THREE.BufferAttribute(size, 1))
  const moteMat = new THREE.ShaderMaterial({ ...add, uniforms: { uTime: { value: 0 }, uPixelRatio: { value: dpr() }, uBrightness: { value: BASE }, uCol: { value: COL.spark } },
    vertexShader: `
      attribute float aSeed, aSize; uniform float uTime, uPixelRatio; varying float vTw;
      void main(){
        vec3 p = position; p.y += sin(uTime * 0.2 + aSeed * 6.2831) * 0.08;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = aSize * uPixelRatio * (18.0 / max(0.001, -mv.z));
        vTw = 0.55 + 0.45 * sin(uTime * 1.3 + aSeed * 6.2831);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uCol; uniform float uBrightness; varying float vTw;
      void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a; gl_FragColor = vec4(uCol * uBrightness * vTw, a * 0.6); }` })
  const motes = new THREE.Points(mg, moteMat); motes.frustumCulled = false; group.add(motes)

  // ---- Post: bloom, then the lens (vignette, gamma, grain dither that kills banding in the soft gradients) ----
  const composer = new EffectComposer(renderer)
  composer.addPass(new RenderPass(scene, camera))
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), ...BLOOM))
  const lens = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(W, H) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
      float grain(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        vec3 col = texture2D(tDiffuse, vUv).rgb;
        vec2 c = vUv - 0.5;
        col *= mix(0.6, 1.0, smoothstep(1.05, 0.25, length(c * vec2(1.0, 1.25))));
        col = pow(max(col, 0.0), vec3(1.0 / 2.2));
        col += (grain(vUv * uRes + fract(uTime) * 61.0) - 0.5) * (2.5 / 255.0);
        gl_FragColor = vec4(col, 1.0);
      }` })
  composer.addPass(lens)

  function layoutRig(){ const wide = (W / H) > 1.15; rig.position.set(wide ? 0.9 : 0, wide ? 0.5 : 1.3, 0) }
  function resize(){
    // Read from the CANVAS, never innerHeight: 100lvh does not change when a mobile URL bar hides on scroll.
    W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight
    const r = dpr()
    renderer.setPixelRatio(r); renderer.setSize(W, H, false)
    camera.aspect = W / H; camera.updateProjectionMatrix()
    composer.setPixelRatio(r); composer.setSize(W, H) // no bloomPass.setSize after this: it would size in CSS pixels
    moteMat.uniforms.uPixelRatio.value = r; lens.uniforms.uRes.value.set(W * r, H * r)
    layoutRig()
    if (reduceMotion) drawFrozen()
  }
  let rt = 0
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120) }, { passive: true })

  // ---- Motion state ----
  const startView = (location.hash.replace(/^#\/?/, '').split('/')[0]) || 'overview'
  const pose0 = POSES[startView] || POSES.overview
  const cam = { p: new THREE.Vector3(...pose0.p), t: new THREE.Vector3(...pose0.t), ry: pose0.ry, dim: pose0.dim }
  let from = null, to = pose0, travelStart = -10
  const mouse = new THREE.Vector2(), mouseTarget = new THREE.Vector2()
  let appearStart = performance.now(), lastT = performance.now() / 1000, spin = 0, energy = 0, energyTarget = 0, scrollRaw = 0, scrollSmooth = 0
  addEventListener('jobagent:view', e => {
    const next = POSES[e.detail]; if (!next || next === to) return
    from = { p: cam.p.clone(), t: cam.t.clone(), ry: cam.ry, dim: cam.dim }; to = next; travelStart = performance.now() / 1000; energyTarget = 1
    if (reduceMotion) { cam.p.set(...to.p); cam.t.set(...to.t); cam.ry = to.ry; cam.dim = to.dim; drawFrozen() }
  })
  addEventListener('scroll', () => { const max = Math.max(1, document.documentElement.scrollHeight - innerHeight); scrollRaw = clamp(scrollY / max, 0, 1) }, { passive: true })
  if (!reduceMotion && !coarse) addEventListener('pointermove', e => {
    const nx = (e.clientX / innerWidth) * 2 - 1, ny = -((e.clientY / innerHeight) * 2 - 1)
    energyTarget = Math.min(1, energyTarget + Math.hypot(nx - mouseTarget.x, ny - mouseTarget.y) * 0.6)
    mouseTarget.set(nx, ny)
  }, { passive: true })

  function pose(now) {
    if (from) {
      const k = clamp((now - travelStart) / TRAVEL_S, 0, 1), e = ease(k)
      cam.p.lerpVectors(new THREE.Vector3(...from.p), new THREE.Vector3(...to.p), e)
      cam.t.lerpVectors(new THREE.Vector3(...from.t), new THREE.Vector3(...to.t), e)
      cam.ry = lerp(from.ry, to.ry, e); cam.dim = lerp(from.dim, to.dim, e)
      if (k >= 1) from = null
    }
    camera.position.set(cam.p.x + mouse.x * 0.35, cam.p.y + mouse.y * 0.22 - scrollSmooth * 0.7, cam.p.z + scrollSmooth * 0.9)
    camera.lookAt(cam.t.x, cam.t.y - scrollSmooth * 0.35, cam.t.z)
    group.rotation.y = cam.ry + spin + mouse.x * 0.06
  }
  function push(time, bright, en) {
    for (const m of mats) { m.uniforms.uTime.value = time; m.uniforms.uBrightness.value = bright; m.uniforms.uEnergy.value = en }
    moteMat.uniforms.uTime.value = time; moteMat.uniforms.uBrightness.value = bright
    lens.uniforms.uTime.value = time
  }
  function frame(){
    requestAnimationFrame(frame)
    if (document.hidden) return
    const now = performance.now() / 1000, dt = Math.min(0.05, now - lastT) // clamp the tab-refocus jump
    lastT = now
    const alpha = clamp((performance.now() - appearStart - 300) / APPEAR_MS, 0, 1)
    energyTarget *= 0.93; energy += (energyTarget - energy) * 0.12
    mouse.lerp(mouseTarget, 0.05)
    scrollSmooth += (scrollRaw - scrollSmooth) * 0.08
    spin += SPIN * dt
    pose(now)
    const narrow = W / H < 1.15 ? 0.7 : 1 // phones: the panels are full width, so the light sits behind text
    const travel = from ? Math.sin(clamp((now - travelStart) / TRAVEL_S, 0, 1) * Math.PI) : 0 // light swells mid-flight
    push(now, BASE * cam.dim * narrow * alpha * (1 + travel * 0.35), energy)
    composer.render()
  }
  function drawFrozen(){ pose(0); push(12.0, BASE * cam.dim * (W / H < 1.15 ? 0.7 : 1), 0); composer.render() }

  resize()
  if (reduceMotion) drawFrozen(); else frame()
  document.documentElement.dataset.scene = 'ready'
} catch (e) {
  document.documentElement.dataset.scene = 'off' // no WebGL: the CSS gradient stays
}
</script>
</body>
</html>
