<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobAgent Dashboard</title>
<style>
:root {
  --glass-tint: 6, 18, 48;
  --glass-teal: 0, 180, 216;
  --glass-edge: 130, 214, 240;
  --glass-blur: 16px;
  --glass-radius: 14px;
  --glass-lift: inset 0 1px 0 rgba(var(--glass-edge), 0.16);
  --glass-drop: 0 12px 40px rgba(0, 0, 0, 0.45);
  --glass-inner: inset 0 0 0 1px rgba(var(--glass-teal), 0.05);
  --ink: #e6f1ff; --ink-2: #9fb6d6; --ink-3: #6f86a8;
  --good: #34d399; --warn: #fbbf24; --bad: #f87171;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
  background: #020817;
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(0, 180, 216, 0.16), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(56, 89, 180, 0.20), transparent 60%),
    linear-gradient(180deg, #030b22, #020817 60%);
  background-attachment: fixed;
}
/* ---- primitives ---- */
.glass-card {
  background: linear-gradient(180deg, rgba(10, 26, 60, 0.60), rgba(3, 12, 34, 0.66));
  border: 1px solid rgba(var(--glass-teal), 0.14);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: var(--glass-radius);
  box-shadow: var(--glass-drop), var(--glass-lift), var(--glass-inner);
}
button.glass-card { transition: transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease); }
button.glass-card:hover { transform: translateY(-2px); border-color: rgba(var(--glass-teal), 0.30); box-shadow: 0 18px 52px rgba(0,0,0,.5), 0 0 26px rgba(var(--glass-teal), .14), var(--glass-lift); }
.btn { position: relative; overflow: hidden; font: inherit; color: var(--ink); cursor: pointer; border-radius: 999px; padding: 9px 18px;
  border: 1px solid rgba(var(--glass-teal), .35); background: linear-gradient(90deg, rgba(4,12,32,.55), rgba(10,26,58,.5), rgba(4,12,32,.55));
  box-shadow: 0 0 22px rgba(var(--glass-teal), .12); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.btn::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(144,224,239,.22) 50%, transparent 65%);
  transform: translateX(-120%); transition: transform .9s var(--ease); }
.btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 0 36px rgba(var(--glass-teal), .22); }
.btn:hover::after, .btn:focus-visible::after { transform: translateX(120%); }
.btn-primary { border-color: rgba(52, 211, 153, .55); box-shadow: 0 0 22px rgba(52, 211, 153, .18); }
.btn-quiet { border-color: rgba(159, 182, 214, .25); box-shadow: none; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
:focus-visible { outline: 2px solid rgba(var(--glass-teal), .9); outline-offset: 3px; }
.kicker { font-size: .7rem; letter-spacing: .32em; text-transform: uppercase; color: rgb(var(--glass-teal)); }
.title { font-size: clamp(1.6rem, 3.6vw, 2.4rem); font-weight: 200; letter-spacing: .2em; margin: 2px 0 0; text-transform: uppercase;
  background: linear-gradient(180deg, #fff 0%, #e6f1ff 45%, #9fb6d6 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(0,180,216,.35)) drop-shadow(0 2px 10px rgba(0,0,0,.8)); }
.hair { height: 1px; width: 112px; background: linear-gradient(90deg, transparent, rgba(var(--glass-teal), .7), transparent); margin: 10px 0 0; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(159,182,214,.25); color: var(--ink-2); }
.score { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.s-hi { color: var(--good); background: rgba(52,211,153,.12); } .s-mid { color: var(--warn); background: rgba(251,191,36,.12); } .s-lo { color: var(--bad); background: rgba(248,113,113,.12); }
/* ---- layout ---- */
.wrap { max-width: 1500px; margin: 0 auto; padding: 32px 24px 64px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
nav { display: flex; gap: 8px; } nav .btn[aria-current="page"] { border-color: rgba(var(--glass-teal), .8); color: #fff; }
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.col { padding: 14px; min-height: 240px; }
.col h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); margin: 0 0 12px; display: flex; justify-content: space-between; }
.col h2 b { color: var(--ink); font-weight: 600; }
.job { display: block; width: 100%; text-align: left; padding: 12px; margin: 0 0 10px; color: var(--ink); font: inherit; cursor: pointer; }
.job .co { font-weight: 600; } .job .ro { color: var(--ink-2); font-size: 13px; margin: 2px 0 8px; }
.job .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 13px; padding: 10px 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.panel { padding: 20px; }
.panel h3 { margin: 0 0 14px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.row { display: grid; grid-template-columns: 110px 1fr 48px; align-items: center; gap: 12px; margin: 8px 0; }
.track { height: 8px; border-radius: 99px; background: rgba(159,182,214,.12); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, rgba(var(--glass-teal), .6), rgb(var(--glass-teal))); transform-origin: left; animation: grow .9s var(--ease) both; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
/* ---- drawer ---- */
.scrim { position: fixed; inset: 0; background: rgba(2, 8, 23, .6); opacity: 0; pointer-events: none; transition: opacity .4s var(--ease); }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(620px, 100%); overflow-y: auto; padding: 28px; border-radius: 0;
  transform: translateX(104%); transition: transform .5s var(--ease); }
.drawer.on { transform: none; }
.drawer h4 { margin: 22px 0 10px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.drawer ul { margin: 0; padding-left: 18px; } .drawer li { margin: 4px 0; }
.chg { padding: 10px 12px; margin: 8px 0; border-radius: 10px; background: rgba(159,182,214,.06); }
.chg del { color: var(--ink-3); } .chg ins { text-decoration: none; color: var(--ink); display: block; margin-top: 4px; }
.ans { display: grid; grid-template-columns: 40% 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(159,182,214,.08); }
.shots img { width: 100%; border-radius: 10px; margin: 6px 0; border: 1px solid rgba(159,182,214,.15); }
.acts { display: flex; gap: 10px; margin-top: 18px; position: sticky; bottom: -28px; padding: 22px 0 14px; background: linear-gradient(180deg, rgba(3,12,34,0), rgba(3,12,34,.98) 22px); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; padding: 10px 18px; transition: all .4s var(--ease); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.close { position: absolute; top: 16px; right: 16px; }
/* ---- entrances ---- */
.rise { animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 760px) {
  .wrap { padding: 20px 16px 48px; }
  .board { grid-template-columns: 1fr; overflow: visible; }
  .col { min-height: 0; }
  .drawer { padding: 20px 16px; }
  .acts { bottom: -20px; } .acts .btn { padding: 9px 14px; } .acts .lbl { display: none; }
  .row { grid-template-columns: 90px 1fr 40px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="rise">
    <div>
      <div class="kicker">JobAgent</div>
      <h1 class="title" id="pageTitle">Pipeline</h1>
      <div class="hair"></div>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
      <span class="pill" id="mode"></span>
      <span class="pill" id="health"></span>
      <nav aria-label="Sections">
        <button class="btn" data-view="pipeline" aria-current="page">Pipeline</button>
        <button class="btn" data-view="insights">Insights</button>
        <button class="btn" data-view="health">Health</button>
      </nav>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer glass-card" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1"></aside>
<div class="toast glass-card" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict'
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const scoreCls = n => n == null ? '' : n >= 80 ? 's-hi' : n >= 60 ? 's-mid' : 's-lo'
const ago = iso => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return !isFinite(m) ? '' : m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago` }
let state = null, view = 'pipeline', openId = null

// Phone (Telegram Mini App): Telegram puts signed launch data in the URL fragment. Trade it for a session token, kept only
// for this tab, then remove it from the address bar. On the computer the cookie from the Telegram link is used instead.
let session = ''
try { session = sessionStorage.getItem('jd-session') || '' } catch {}
async function signIn() {
  const data = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData')
  if (!data) return
  history.replaceState(null, '', location.pathname)
  const r = await fetch('/api/tg-auth', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ init_data: data }) })
  const x = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(x.error || 'Could not sign in.')
  session = x.token
  try { sessionStorage.setItem('jd-session', session) } catch {}
}
const authHeaders = () => (session ? { 'x-session': session } : {})
async function loadImages(root) {
  for (const img of root.querySelectorAll('img[data-src]')) {
    try { const r = await fetch(img.dataset.src, { headers: authHeaders() }); if (r.ok) img.src = URL.createObjectURL(await r.blob()) } catch {}
  }
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) } : { headers: authHeaders() })
  const x = await r.json().catch(() => ({ error: 'The app did not answer.' }))
  if (!r.ok) throw new Error(x.error || 'Something went wrong.')
  return x
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200) }

function header() {
  $('#mode').innerHTML = state.practice ? '🧪 Practice mode' : '🟢 Live: approvals are sent'
  const h = state.health, bad = h ? h.checks.filter(c => !c.ok && c.required).length : 0
  $('#health').innerHTML = !h ? '🩺 Not checked yet' : bad ? `🩺 ${bad} problem${bad > 1 ? 's' : ''}` : '🩺 All good'
}

function pipeline() {
  const by = Object.fromEntries(state.columns.map(c => [c, []]))
  for (const j of state.jobs) by[j.column].push(j)
  return `<div class="board">${state.columns.map((c, i) => `
    <section class="col glass-card rise" style="--i:${i}" aria-label="${esc(c)}">
      <h2>${esc(c)} <b>${by[c].length}</b></h2>
      ${by[c].length ? by[c].slice(0, 60).map(j => `
        <button class="job glass-card" data-job="${esc(j.id)}">
          <div class="co">${esc(j.company || 'Unknown company')}</div>
          <div class="ro">${esc(j.role || j.id)}</div>
          <div class="meta"><span>${esc(j.status)}</span>${j.score != null ? `<span class="score ${scoreCls(j.score)}">${j.score}</span>` : ''}</div>
        </button>`).join('') : '<div class="empty">Nothing here.</div>'}
    </section>`).join('')}</div>`
}

function bars(rows, max) { return rows.map(([l, n, of]) => `<div class="row"><span class="muted">${esc(l)}</span><div class="track"><div class="fill" style="width:${max ? Math.max(2, n / max * 100) : 0}%"></div></div><span class="num">${n}${of ? `<span class="faint"> ${of}</span>` : ''}</span></div>`).join('') }
function insights() {
  const a = state.insights.all, w = state.insights.week, pct = (x, y) => y ? Math.round(x / y * 100) + '%' : ''
  const bands = state.insights.bands.filter(b => b.n)
  return `<div class="grid2">
    <section class="panel glass-card rise" style="--i:0"><h3>All time</h3>${bars([['Found', a.found], ['Prepared', a.prepared, pct(a.prepared, a.found)], ['Applied', a.applied, pct(a.applied, a.prepared)], ['Replies', a.replied, pct(a.replied, a.applied)], ['Interviews', a.interview, pct(a.interview, a.applied)], ['Offers', a.offer]], a.found)}</section>
    <section class="panel glass-card rise" style="--i:1"><h3>This week</h3>${bars([['Found', w.found], ['Prepared', w.prepared], ['Applied', w.applied], ['Interviews', w.interview]], Math.max(1, w.found))}</section>
    <section class="panel glass-card rise" style="--i:2"><h3>Interviews by match score</h3>${bands.length ? bars(bands.map(b => [b.name, b.interviews, `of ${b.n}`]), Math.max(...bands.map(b => b.n))) : '<p class="muted">Mark results on applied jobs (in Telegram, Jobs → Applied) and this fills in.</p>'}</section>
  </div>`
}
function health() {
  const h = state.health
  if (!h) return '<section class="panel glass-card rise"><p class="muted">The first check runs a few seconds after JobAgent starts.</p></section>'
  return `<section class="panel glass-card rise"><h3>Checked ${esc(ago(new Date(h.at).toISOString()))}</h3>${h.checks.map((c, i) => `<div class="ans rise" style="--i:${i}"><span>${c.ok ? '✅' : c.required ? '❌' : '⚠️'} ${esc(c.name)}</span><span class="muted">${esc(c.detail)}</span></div>`).join('')}</section>`
}

function render() {
  header()
  $('#pageTitle').textContent = { pipeline: 'Pipeline', insights: 'Insights', health: 'Health' }[view]
  document.querySelectorAll('nav .btn').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'))
  $('#view').innerHTML = view === 'pipeline' ? pipeline() : view === 'insights' ? insights() : health()
}

const PARTS = { title: 'Title', seniority: 'Level', skills: 'Skills', location: 'Place', pay: 'Pay' }
const MUST = { met: '✅', partial: '🟡', missing: '❌' }
async function openJob(id) {
  let j
  try { j = await api(`/api/job/${encodeURIComponent(id)}`) } catch (e) { return toast(e.message) }
  openId = id
  const d = $('#drawer'), rv = j.review
  const parts = Object.entries(PARTS).filter(([k]) => typeof j.breakdown[k] === 'number')
  d.innerHTML = `
    <button class="btn btn-quiet close" id="dClose" aria-label="Close">✕</button>
    <div class="kicker">${esc(j.status)}</div>
    <h2 id="dTitle" style="margin:6px 0 2px; font-weight:300; font-size:1.6rem">${esc(j.company || 'Unknown company')}</h2>
    <div class="muted">${esc(j.role)}${j.location ? ` · ${esc(j.location)}` : ''}${j.salary ? ` · ${esc(j.salary)}` : ''}</div>
    ${j.score != null ? `<p><span class="score ${scoreCls(j.score)}">Match ${j.score}/100</span></p>` : ''}
    ${parts.length ? `<h4>Score parts</h4>${bars(parts.map(([k, l]) => [l, j.breakdown[k]]), 100)}` : ''}
    ${j.must_haves.length ? `<h4>They require</h4><div>${j.must_haves.map(m => `<span class="pill" style="margin:3px">${MUST[m.status]} ${esc(m.text)}</span>`).join('')}</div>` : ''}
    ${rv && rv.coverage && rv.coverage.after != null ? `<p class="muted">Keywords on your resume: ${rv.coverage.before}% → <b style="color:var(--ink)">${rv.coverage.after}%</b></p>` : ''}
    ${j.reasons.length ? `<h4>Why it fits</h4><ul>${j.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    ${j.dealbreakers.length ? `<p style="color:var(--warn)">⚠️ ${esc(j.dealbreakers.join('; '))}</p>` : ''}
    ${j.changes.length ? `<h4>What I changed on your resume</h4>${j.changes.map(c => `<div class="chg"><del>${esc(c.old)}</del><ins>${esc(c.new)}</ins>${c.reason ? `<div class="faint">${esc(c.reason)}</div>` : ''}</div>`).join('')}` : ''}
    ${rv && rv.cover_letter ? `<h4>Cover letter</h4><div class="chg" style="white-space:pre-wrap">${esc(rv.cover_letter)}</div>` : ''}
    ${j.answers.length ? `<h4>What I filled in</h4>${j.answers.map(a => `<div class="ans"><span class="muted">${esc(a.label)}</span><span>${a.private ? '<span class="faint">🔒 private: see Telegram</span>' : esc(a.value)}</span></div>`).join('')}` : ''}
    ${j.images.length ? `<h4>Screenshots</h4><div class="shots">${j.images.map(f => `<img alt="${esc(f.replace('.png', ''))} screenshot" data-src="/api/job/${encodeURIComponent(id)}/img/${f}">`).join('')}</div>` : ''}
    ${j.receipt ? `<h4>Receipt</h4><p class="muted">${j.receipt.practice ? 'Practice run' : 'Sent'} ${esc(ago(j.receipt.at))} · ${j.receipt.answers} answers · ${esc((j.receipt.files || []).join(', '))}</p>` : ''}
    <h4>History</h4>${j.history.slice().reverse().map(h => `<div class="ans"><span class="faint">${esc(ago(h.at))}</span><span>${esc(h.status)}${h.detail ? ` <span class="muted">· ${esc(h.detail)}</span>` : ''}</span></div>`).join('')}
    <div class="acts">
      ${rv ? `<button class="btn btn-primary" id="dOk">${state.practice ? '✅ Approve (practice)' : '✅ Approve &amp; send'}</button><button class="btn btn-quiet" id="dSkip">⏭ Skip</button>` : ''}
      ${j.url ? `<a class="btn btn-quiet" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none" aria-label="Open posting">🔗<span class="lbl"> Posting</span></a>` : ''}
    </div>`
  d.classList.add('on'); $('#scrim').classList.add('on'); d.focus()
  loadImages(d)
  $('#dClose').onclick = closeJob
  if (rv) {
    $('#dOk').onclick = () => act(id, 'approve', { plan_hash: rv.plan_hash }, state.practice ? 'Approved: running it as practice.' : 'Approved: sending it now.')
    $('#dSkip').onclick = () => act(id, 'skip', {}, 'Skipped.')
  }
}
async function act(id, what, body, done) {
  document.querySelectorAll('.acts .btn').forEach(b => b.disabled = true)
  try { await api(`/api/job/${encodeURIComponent(id)}/${what}`, body); toast(done); closeJob(); await load() }
  catch (e) { toast(e.message); document.querySelectorAll('.acts .btn').forEach(b => b.disabled = false) }
}
function closeJob() { openId = null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on') }

async function load() {
  try { state = await api('/api/state') } catch (e) { $('#view').innerHTML = `<section class="panel glass-card"><p>${esc(e.message)}</p></section>`; return }
  render()
}
document.addEventListener('click', e => {
  const j = e.target.closest('[data-job]'); if (j) return openJob(j.dataset.job)
  const v = e.target.closest('[data-view]'); if (v) { view = v.dataset.view; render() }
})
$('#scrim').onclick = closeJob
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openId) closeJob() })
signIn().then(load, e => { $('#view').innerHTML = `<section class="panel glass-card"><p>${esc(e.message)}</p></section>` })
setInterval(() => { if (!openId && document.visibilityState === 'visible') load() }, 30000)
</script>
</body>
</html>
