<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="JobAgent: search for jobs, tailor your resume and apply from a Telegram chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#2a1f5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="chat"><rect x="700" y="36" width="430" height="348" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="180" fill="#38bdf8" opacity="0.06"/>
  <circle cx="1100" cy="400" r="220" fill="#a78bfa" opacity="0.10"/>

  <!-- Title -->
  <text x="70" y="178" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">Job<tspan fill="url(#accent)">Agent</tspan></text>
  <text x="72" y="232" font-size="26" fill="#cbd5e1">Find jobs. Tailor your resume.</text>
  <text x="72" y="266" font-size="26" fill="#cbd5e1">Apply, all from a Telegram chat.</text>

  <!-- Pills -->
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="72" y="306" width="130" height="38" rx="19" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="137" y="331" fill="#7dd3fc">Search</text>
    <rect x="214" y="306" width="130" height="38" rx="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="279" y="331" fill="#c4b5fd">Tailor</text>
    <rect x="356" y="306" width="130" height="38" rx="19" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-opacity="0.5"/>
    <text x="421" y="331" fill="#86efac">Approve</text>
  </g>

  <!-- Chat window -->
  <rect x="700" y="36" width="430" height="348" rx="22" fill="#17212b" stroke="#ffffff" stroke-opacity="0.12"/>
  <g clip-path="url(#chat)">
    <rect x="700" y="36" width="430" height="60" fill="#1f2c3a"/>
  </g>
  <circle cx="738" cy="66" r="18" fill="url(#accent)"/>
  <!-- tiny briefcase on avatar -->
  <rect x="729" y="61" width="18" height="12" rx="2" fill="#0b1220"/>
  <rect x="734" y="57" width="8" height="5" rx="1.5" fill="none" stroke="#0b1220" stroke-width="2"/>
  <text x="768" y="62" font-size="17" font-weight="700" fill="#ffffff">JobAgent</text>
  <text x="768" y="82" font-size="13" fill="#4ade80">online</text>

  <!-- User bubble -->
  <rect x="868" y="112" width="244" height="44" rx="16" fill="#2b5278"/>
  <text x="884" y="140" font-size="15" fill="#e2e8f0">boards.greenhouse.io/acme/…</text>

  <!-- Bot bubble: score -->
  <rect x="718" y="170" width="300" height="86" rx="16" fill="#182533"/>
  <text x="736" y="196" font-size="15" font-weight="700" fill="#ffffff">Acme · Data Analyst</text>
  <text x="736" y="218" font-size="14" fill="#94a3b8">Match score</text>
  <text x="1000" y="218" font-size="14" font-weight="700" fill="#4ade80" text-anchor="end">87/100</text>
  <rect x="736" y="230" width="264" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="736" y="230" width="230" height="8" rx="4" fill="url(#accent)"/>

  <!-- Bot bubble: review -->
  <rect x="718" y="268" width="300" height="100" rx="16" fill="#182533"/>
  <text x="736" y="294" font-size="14" fill="#cbd5e1">Resume tailored. Form filled.</text>
  <text x="736" y="314" font-size="14" fill="#cbd5e1">Ready for your review.</text>
  <rect x="736" y="326" width="118" height="30" rx="9" fill="#16a34a"/>
  <text x="795" y="346" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Approve</text>
  <rect x="864" y="326" width="90" height="30" rx="9" fill="#ffffff" fill-opacity="0.1"/>
  <text x="909" y="346" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Skip</text>

  <!-- Job card -->
  <g transform="translate(560 300) rotate(-8)">
    <rect width="150" height="96" rx="12" fill="#ffffff"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="url(#accent)"/>
    <rect x="54" y="16" width="70" height="8" rx="4" fill="#334155"/>
    <rect x="54" y="32" width="46" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="14" y="56" width="122" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="14" y="70" width="84" height="7" rx="3.5" fill="#e2e8f0"/>
    <circle cx="128" cy="76" r="13" fill="#16a34a"/>
    <path d="M121 76 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Magnifying glass -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <circle cx="640" cy="120" r="36" stroke-width="9" fill="#38bdf8" fill-opacity="0.12"/>
    <line x1="666" y1="146" x2="696" y2="176" stroke-width="11"/>
    <path d="M624 112 a18 18 0 0 1 14 -12" stroke-width="5" stroke="#ffffff" stroke-opacity="0.7"/>
  </g>
</svg>
